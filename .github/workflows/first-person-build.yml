name: First-person build

on:
  push:
    branches: [ 3d-spike ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the jar
        shell: bash
        run: ./gradlew :desktop:dist --no-daemon
      - name: Bundle with its own Java (no install needed)
        shell: bash
        run: |
          mkdir -p input out
          cp desktop/build/libs/Mindustry.jar input/
          jpackage --type app-image --name Mindustry-FirstPerson --input input --main-jar Mindustry.jar --main-class mindustry.desktop.DesktopLauncher --dest out --java-options "-Xmx2g"
          cd out
          if [ "${{ matrix.ext }}" = "zip" ]; then
            if [ "${{ matrix.name }}" = "Windows" ]; then 7z a ../Mindustry-FirstPerson-${{ matrix.name }}.zip Mindustry-FirstPerson; else zip -qr ../Mindustry-FirstPerson-${{ matrix.name }}.zip Mindustry-FirstPerson*; fi
          else
            tar czf ../Mindustry-FirstPerson-${{ matrix.name }}.tar.gz Mindustry-FirstPerson
          fi
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: first-person-latest
          name: First-person build (latest)
          body: |
            Download the file for your system, unzip it, and run Mindustry-FirstPerson (Mindustry-FirstPerson.exe on Windows). No Java needed.
            First-person is on by default; F8 toggles it. See FIRST_PERSON.md.
          files: Mindustry-FirstPerson-${{ matrix.name }}.${{ matrix.ext }}
          prerelease: true
